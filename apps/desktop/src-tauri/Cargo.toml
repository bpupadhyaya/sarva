[package]
name = "sarva-desktop"
version = "0.1.0"
description = "Sarva — an open, all-in-one multimodal AGI tool (desktop wrapper)"
authors = ["Sarva contributors"]
license = "MIT"
repository = "https://github.com/bpupadhyaya/sarva"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sarva_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# A real, checked gap found by a fresh-eyes sweep, the identical shape
# just found and fixed in foundry/pyproject.toml's unused `numpy`: this
# crate's own source (lib.rs/main.rs -- the only two Rust files here)
# never references `serde`/`serde_json` directly, and neither derives
# nor manually implements Serialize/Deserialize on any type. Verified,
# not assumed: `cargo check --offline` compiles cleanly with both
# removed from this list -- they remain in Cargo.lock only as real
# transitive dependencies of `tauri` itself, never as something this
# crate's own code needs. The same "don't declare a dependency the code
# doesn't actually use" discipline as the numpy fix, on the Rust side.
[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
