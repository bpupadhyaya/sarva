# Sarva model registry — one entry per model Sarva can route to.
# This is what makes "absorb the next frontier model" a data edit, not a code
# change. Keep this file current; it is re-validated at every release.
models:
  - id: claude-opus-4-8
    provider: anthropic
    display_name: Claude Opus 4.8
    capabilities:
      modalities_in: [text, image, document]
      modalities_out: [text]
      tool_use: true
      thinking: true
      context_window: 1000000
      max_output: 128000
    cost: { input_per_mtok: 5.0, output_per_mtok: 25.0 }

  - id: claude-fable-5
    provider: anthropic
    display_name: Claude Fable 5
    capabilities:
      modalities_in: [text, image, document]
      modalities_out: [text]
      tool_use: true
      thinking: true
      context_window: 1000000
      max_output: 128000
    cost: { input_per_mtok: 10.0, output_per_mtok: 50.0 }

  - id: claude-haiku-4-5
    provider: anthropic
    display_name: Claude Haiku 4.5
    capabilities:
      modalities_in: [text, image, document]
      modalities_out: [text]
      tool_use: true
      thinking: false
      context_window: 200000
      max_output: 64000
    cost: { input_per_mtok: 1.0, output_per_mtok: 5.0 }

  - id: gpt-4o-mini
    provider: openai
    display_name: GPT-4o mini
    capabilities:
      # A real gap found by a fresh-eyes sweep: OpenAIProvider/GoogleProvider
      # have been fully built and unit-tested since early in this project
      # (real streaming, tool-use, error-handling fixes -- see
      # docs/providers.md), and runtime.py's own build_providers()/
      # run_diagnostics() have always gated availability on OPENAI_API_KEY/
      # GEMINI_API_KEY being set -- but build_router() only ever loads
      # models FROM THIS FILE, and neither provider had a single entry
      # here. Confirmed live: `available |= {m.id for m in registry.all()
      # if m.provider == "openai"}` (runtime.py) computed an empty set
      # regardless of whether a real key was configured, since no model
      # anywhere in the registry declared `provider: openai` -- meaning a
      # user with a real, valid OPENAI_API_KEY/GEMINI_API_KEY configured
      # got exactly the same routing as no key at all. `sarva doctor`'s own
      # "OpenAI API key: OPENAI_API_KEY is set" line was true but
      # materially misleading -- a configured key that could never
      # actually be routed to.
      #
      # modalities_in matches what openai_provider.py's own translation
      # function can ACTUALLY send today (text + image only -- no
      # DocumentBlock branch exists there), not what OpenAI's platform
      # supports in the abstract -- the identical "claim only what the
      # adapter code backs up" discipline the Anthropic document-block fix
      # (round 462) established, applied here from the start rather than
      # repeating that gap for a new provider.
      #
      # id/pricing/context window: a real, named snapshot of this
      # project's own knowledge as of 2026-09 (gpt-4o-mini was already
      # this project's own `OPENAI_TEST_MODEL` live-test default in
      # tests/live/test_live_providers.py, not a fresh guess) -- NOT
      # verified against a live API key in this environment (see this
      # provider's own module docstring). Flagged honestly, the same
      # "not yet exercised against a live API key" caveat every adapter
      # in this file already carries: a maintainer with a real key should
      # confirm this entry (and add a flagship OpenAI tier alongside it)
      # before fully trusting it, rather than this being silently assumed
      # permanently current.
      modalities_in: [text, image]
      modalities_out: [text]
      tool_use: true
      thinking: false
      context_window: 128000
      max_output: 16384
    cost: { input_per_mtok: 0.15, output_per_mtok: 0.6 }

  - id: gemini-2.0-flash
    provider: google
    display_name: Gemini 2.0 Flash
    capabilities:
      # The identical registry gap gpt-4o-mini above closes, one
      # provider over -- see that entry's own comment for the full story
      # (runtime.py's availability check silently resolved to an empty
      # set for `provider: google` too, regardless of a real
      # GEMINI_API_KEY/GOOGLE_API_KEY being configured).
      #
      # modalities_in includes `video`, not just `image`: unlike the
      # OpenAI entry above, google_provider.py's own translation function
      # already has a real, tested VideoBlock branch (the identical
      # inline_data/Blob shape as images -- Gemini's native video
      # understanding, see docs/providers.md's "Video-in" chapter) --
      # `document` is still correctly left out, since that adapter has no
      # DocumentBlock branch either, the same "claim only what the code
      # backs up" discipline as the OpenAI entry.
      #
      # id/pricing/context window: gemini-2.0-flash was already this
      # project's own `GOOGLE_TEST_MODEL` live-test default in
      # tests/live/test_live_providers.py -- a real, named 2026-09
      # snapshot, NOT verified against a live API key in this environment
      # (see this provider's own module docstring). Same honest,
      # named-for-a-future-maintainer caveat as the OpenAI entry above.
      modalities_in: [text, image, video]
      modalities_out: [text]
      tool_use: true
      thinking: false
      context_window: 1048576
      max_output: 8192
    cost: { input_per_mtok: 0.1, output_per_mtok: 0.4 }

  - id: ollama/qwen3:8b
    provider: ollama
    display_name: Qwen 3 8B (local)
    local: true
    capabilities:
      modalities_in: [text]
      modalities_out: [text]
      tool_use: true
      thinking: false
      context_window: 131072
      max_output: 32768
    cost: { input_per_mtok: 0.0, output_per_mtok: 0.0 }

  - id: ollama/moondream:latest
    provider: ollama
    display_name: Moondream (local, vision)
    local: true
    capabilities:
      # A real vision-capable local model, not a hypothetical registry
      # entry -- OllamaProvider's `images` wire field and this entry
      # were both verified together against a real running server:
      # `ollama pull moondream`, then a real image genuinely described
      # correctly ("a vibrant red square..."), not just accepted
      # silently. No tool_use: moondream is vision+completion only per
      # its own real /api/tags capabilities list, confirmed before
      # writing this, not assumed from its size class.
      modalities_in: [text, image]
      modalities_out: [text]
      tool_use: false
      thinking: false
      context_window: 2048
      max_output: 2048
    cost: { input_per_mtok: 0.0, output_per_mtok: 0.0 }

  - id: mock
    provider: mock
    display_name: Mock Provider (offline, deterministic)
    local: true
    capabilities:
      # A real bug found by property-based fuzzing of the tokenizer
      # led to a fresh-eyes sweep of this file: `image` and `document`
      # were declared here since the very first T0/T1 scaffold commit,
      # and it looked harmless -- MockProvider.generate() doesn't
      # actually inspect modality at all, it just echoes text, so
      # nothing crashes. But `Router.pick()` (registry.py) returns the
      # FIRST candidate in a routing chain that satisfies the needed
      # modalities, and `main`'s chain is `[claude-opus-4-8,
      # ollama/qwen3:8b, mock]` -- with mock claiming `image` support,
      # `pick(MAIN, needs={TEXT, IMAGE})` resolved straight to mock
      # instead of ever raising LookupError, which is the ONLY thing
      # that triggers AgentLoop's degradation-fallback branch
      # (loop.py). Confirmed live: a completely ordinary "local Ollama
      # only, no cloud key" setup (`available={"mock",
      # "ollama/qwen3:8b"}`) sending `sarva chat "describe this" --image
      # photo.png` completed with `state=done` and mock's fake
      # "[mock] received: describe this" text -- the real image
      # silently discarded, never even converted via
      # ImageToTextDegrader and handed to the real (if text-only)
      # qwen3:8b model the degradation path exists specifically to use
      # instead. `document` sits in the same `main`-reachable bucket
      # (a real DocumentToTextDegrader already exists, just not yet
      # wired to a CLI flag) so it's removed for the same reason,
      # proactively, before it ships a flag and reproduces the same
      # bug.
      #
      # A much later fresh-eyes sweep found the reasoning that used to
      # sit right here -- "audio/video are NOT part of this bug class,
      # routing.yaml's audio chain is [mock] alone" -- only ever
      # considered the dedicated `audio`/`vision` TaskClass routing
      # chains, never the fact that mock is ALSO listed in `main`'s
      # chain, the ONE chain AgentLoop actually consults for every real
      # message (`self._task_class` defaults to `TaskClass.MAIN` and is
      # only ever overridden to `SUBTASK` for delegated/verify subtasks
      # -- confirmed live, nothing anywhere ever passes
      # `TaskClass.AUDIO`/`TaskClass.VISION` outside two test call
      # sites). So the identical bug this comment already fixed for
      # image/document was still live for audio/video, just one layer
      # removed: `Router.pick(MAIN, needs={TEXT, AUDIO})` resolved
      # straight to mock instead of raising LookupError, silently
      # defeating AgentLoop's degradation-fallback branch -- which would
      # otherwise invoke the fully-built, wired-by-default
      # AudioToTextDegrader/VideoToTextDegrader (see
      # sarva.multimodal.degraders.default_degraders). Confirmed live: a
      # real AgentLoop.run(..., extra_content=[AudioBlock(...)]) against
      # the real shipped registry (only "mock" available) completed with
      # state=DONE and mock's fake echoed text, the real audio silently
      # discarded, zero calls to AudioToTextDegrader.degrade(). Removed
      # for the same reason image/document were.
      modalities_in: [text]
      modalities_out: [text]
      tool_use: true
      thinking: true
      context_window: 1000000
      max_output: 128000
    cost: { input_per_mtok: 0.0, output_per_mtok: 0.0 }
